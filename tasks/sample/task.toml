schema_version = "1.4"
artifacts = ["/app/bet.json", "/app/view.txt", "/app/sessions"]
multi_step_reward_strategy = "mean"

[task]
name = "agent-learning-bench/tally"
version = "1.0.0"
description = "Multi-step Tally color-betting card game"
keywords = ["cards", "counting", "multi-step", "tally"]

[[task.authors]]
name = "Manoj Bajaj"
email = "manoj@example.com"

[metadata]
difficulty = "medium"
category = "games"
tags = ["cards", "multi-step", "learning"]

[agent]
timeout_sec = 60.0

[verifier]
timeout_sec = 30.0

[environment]
network_mode = "public"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
workdir = "/app"

