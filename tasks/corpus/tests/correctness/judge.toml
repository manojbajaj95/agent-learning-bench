[judge]
judge = "openai/gpt-5.6-luna"
files = ["/app/question.md", "/app/answer.json", "/opt/corpus/reference.md"]
timeout = 120

[[criterion]]
description = "Does the agent's answer agree with the gold reference on the facts that matter (numbers, names, procedures, and policy text)? Paraphrase is allowed. Score low if the answer is missing, contradicts the gold, or invents wiki pages or facts the gold does not support."
type = "likert"
points = 5
