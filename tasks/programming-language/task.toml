schema_version = "1.4"
multi_step_reward_strategy = "mean"
artifacts = ["/app/view.txt", "/app/notes.md", "/app/workspace", "/app/sessions"]

[task]
name = "agent-learning-bench/programming-language"
version = "0.3.0"
description = "Learn one generated programming language across twenty programming problems."
keywords = ["programming", "hidden-rules", "multi-step", "continual-learning", "holdout"]

[metadata]
difficulty = "hard"
category = "programming"
seed = 1
visibility = "hidden"

[agent]
user = "agent"
timeout_sec = 300.0

[verifier]
user = "root"
timeout_sec = 30.0

[environment]
network_mode = "public"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
workdir = "/app"

[[steps]]
name = "problem-01"
artifacts = ["/app/problems/problem-01.jsonl"]

