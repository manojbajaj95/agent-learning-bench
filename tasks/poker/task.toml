schema_version = "1.4"
multi_step_reward_strategy = "final"
artifacts = ["/app/view.txt", "/app/sessions"]

[task]
name = "agent-learning-bench/poker"
version = "0.1.0"
description = "Heads-up Hold'em against a sticky opponent. Score is chips at the end."
keywords = ["poker", "multi-step", "learning", "games"]

[metadata]
difficulty = "hard"
category = "games"
seed = 1

[agent]
user = "agent"
timeout_sec = 180.0

[verifier]
user = "root"
timeout_sec = 30.0

[environment]
network_mode = "public"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
workdir = "/app"

