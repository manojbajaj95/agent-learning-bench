[project]
name = "alb"
version = "0.1.0"
description = "CLI for Agent Learning Bench"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.21",
]

[project.scripts]
alb = "alb.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["alb"]
